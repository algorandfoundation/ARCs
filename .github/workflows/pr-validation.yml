name: PR validation
on:
  pull_request:
permissions:
  contents: read
env:
  GO_VERSION: "1.26.1"
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"
  PRE_COMMIT_VERSION: "4.4.0"
  GOCACHE: /tmp/arckit-go-cache
  GOMODCACHE: /tmp/arckit-go-mod-cache
jobs:
  ci-scripts:
    name: ci-scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Run CI script tests
        run: |
          node --test .github/scripts/tests/*.test.mjs
  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pre-commit==${PRE_COMMIT_VERSION}"
      - name: Run hygiene checks
        run: |
          pre-commit run --from-ref "${{ github.event.pull_request.base.sha }}" --to-ref "${{ github.event.pull_request.head.sha }}" --show-diff-on-failure
      - name: Run advisory spell check
        continue-on-error: true
        run: |
          pre-commit run codespell --hook-stage manual --from-ref "${{ github.event.pull_request.base.sha }}" --to-ref "${{ github.event.pull_request.head.sha }}"
  arckit-tool:
    name: arckit-tool
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Detect relevant changes
        id: changes
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- 'arckit/**' '.github/workflows/**' | grep -q .; then
            echo "run=true" >> "${GITHUB_OUTPUT}"
          else
            echo "run=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Skip irrelevant changes
        if: steps.changes.outputs.run != 'true'
        run: echo "No arckit or workflow changes detected."
      - name: Verify gofmt
        if: steps.changes.outputs.run == 'true'
        run: |
          cd arckit
          DIFF="$(find . -name '*.go' -print0 | xargs -0 gofmt -d -s)"
          if [[ -n "${DIFF}" ]]; then
            echo "${DIFF}"
            exit 1
          fi
      - name: Run go vet
        if: steps.changes.outputs.run == 'true'
        run: |
          cd arckit
          go vet ./...
      - name: Run go test
        if: steps.changes.outputs.run == 'true'
        run: |
          cd arckit
          go test ./...
      - name: Run go build
        if: steps.changes.outputs.run == 'true'
        run: |
          cd arckit
          go build ./cmd/arckit
      - name: Dry-run release packaging
        if: steps.changes.outputs.run == 'true'
        run: |
          chmod +x .github/scripts/build-arckit-release.sh
          RELEASE_DIR="$(.github/scripts/build-arckit-release.sh "${RUNNER_TEMP}/arckit-release" "v0.0.0-dev")"
          test -f "${RELEASE_DIR}/SHA256SUMS"
  repo-validate-offline:
    name: repo-validate-offline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Detect relevant changes
        id: changes
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- 'ARCs/**' 'adoption/**' 'templates/**' 'arckit/**' | grep -q .; then
            echo "run=true" >> "${GITHUB_OUTPUT}"
          else
            echo "run=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Skip irrelevant changes
        if: steps.changes.outputs.run != 'true'
        run: echo "No ARC, adoption, template, or arckit changes detected."
      - name: Build arckit
        if: steps.changes.outputs.run == 'true'
        run: |
          cd arckit
          go build -o "${RUNNER_TEMP}/arckit" ./cmd/arckit
      - name: Validate repository offline
        if: steps.changes.outputs.run == 'true'
        run: |
          "${RUNNER_TEMP}/arckit" validate repo .
      - name: Detect changed ARC files
        if: steps.changes.outputs.run == 'true'
        id: changed_arcs
        run: |
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- 'ARCs/*.md' | grep -E '^ARCs/arc-[0-9]{4}\.md$' > "${RUNNER_TEMP}/changed-arcs.txt" || true
          if [[ -s "${RUNNER_TEMP}/changed-arcs.txt" ]]; then
            echo "run=true" >> "${GITHUB_OUTPUT}"
          else
            echo "run=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Enforce migrated ARC rules on changed ARC files
        if: steps.changed_arcs.outputs.run == 'true'
        run: |
          while IFS= read -r path; do
            "${RUNNER_TEMP}/arckit" validate arc \
              --enforce-rule R:004 \
              --enforce-rule R:008 \
              --enforce-rule R:025 \
              --enforce-rule R:032 \
              "${path}"
          done < "${RUNNER_TEMP}/changed-arcs.txt"
      - name: Validate ARC status transitions
        if: steps.changed_arcs.outputs.run == 'true'
        run: |
          front_matter_field() {
            awk -v field="$1" 'NR == 1 && $0 == "---" { inside = 1; next } inside && $0 == "---" { exit } inside && sub("^" field ":[[:space:]]*", "") { print; exit }'
          }
          today="$(date -u +%F)"
          failed=0
          while IFS= read -r path; do
            if ! git cat-file -e "${{ github.event.pull_request.base.sha }}:${path}" 2>/dev/null; then
              continue
            fi
            from="$(git show "${{ github.event.pull_request.base.sha }}:${path}" | front_matter_field status)"
            to="$(front_matter_field status < "${path}")"
            if [[ "${from}" == "${to}" ]]; then
              continue
            fi
            # ARC-0000 allows these moves without a forward gate; any other move into a gated
            # status is validated, so skipped gates (e.g. Draft -> Final) fail.
            case "${from} -> ${to}" in
              "Last Call -> Review" | "Idle -> Final" | *" -> Draft" | *" -> Stagnant" | *" -> Withdrawn" | *" -> Deprecated" | *" -> Living")
                echo "No machine-checkable gate for ${path}: ${from} -> ${to}"
                ;;
              *)
                echo "Validating ${path}: ${from} -> ${to}"
                "${RUNNER_TEMP}/arckit" validate transition --from "${from}" --to "${to}" "${path}" || failed=1
                if [[ "${from} -> ${to}" == "Last Call -> Final" ]]; then
                  # The deadline is removed on Final (R:033), so read it from the base branch.
                  deadline="$(git show "${{ github.event.pull_request.base.sha }}:${path}" | front_matter_field last-call-deadline)"
                  if [[ -z "${deadline}" || "${today}" < "${deadline}" ]]; then
                    echo "ERROR ${path}: last-call-deadline ${deadline:-<missing>} has not been reached (today is ${today})"
                    failed=1
                  fi
                fi
                ;;
            esac
          done < "${RUNNER_TEMP}/changed-arcs.txt"
          exit "${failed}"
